<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For Us ❤️</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #250014, #4b0028, #18000e);
    color: white;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #ffb6d9;
    font-size: 20px;
    margin-bottom: 35px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    padding: 20px;
}

.card h2 {
    color: #ff9dcc;
    font-size: 25px;
}

.youtube-link {
    display: block;
    text-decoration: none;
    background: #ff0033;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 18px;
    font-size: 21px;
    font-weight: bold;
    margin-top: 20px;
}

.youtube-link:active {
    transform: scale(0.98);
}

.note {
    text-align: center;
    color: #ffb6d9;
    margin-top: 15px;
}

.footer {
    text-align: center;
    color: #ffb6d9;
    margin-top: 40px;
}
</style>
</head>

<body>

<div class="container">

    <h1>❤️ Just For Us ❤️</h1>

    <div class="subtitle">
        A little place made just for you.
    </div>

    <div class="card">

        <h2>🎵 Our Special Video</h2>

        <a class="youtube-link"
           href="https://youtube.com/shorts/duEuPlVba1s?si=7eY0sEXplafR6zNf"
           target="_blank">
           ▶️ Watch on YouTube
        </a>

        <div class="note">
            Tap the button to open the video on YouTube ❤️
        </div>

    </div>

    <div class="footer">
        Made with ❤️ just for you
    </div>

</div>

</body>
</html>
