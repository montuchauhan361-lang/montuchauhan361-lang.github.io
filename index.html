<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just For Us ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #18000d, #4b0028, #16000c);
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 40px;
    margin: 20px 0 8px;
}

.subtitle {
    text-align: center;
    color: #ffb8d8;
    font-size: 18px;
    margin-bottom: 35px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.card h2 {
    color: #ffafd2;
    margin: 5px 0 18px;
}

.youtube-card {
    display: block;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    text-decoration: none;
    background: #111;
}

.youtube-card img {
    display: block;
    width: 100%;
    height: auto;
}

.play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 76px;
    height: 52px;
    border-radius: 15px;

    background: #ff0033;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

.watch-text {
    text-align: center;
    margin-top: 18px;
    color: #ffb8d8;
    font-size: 16px;
}

.footer {
    text-align: center;
    margin-top: 40px;
    color: #ffb8d8;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <h1>❤️ Just For Us ❤️</h1>

    <div class="subtitle">
        A little place made just for you.
    </div>

    <div class="card">

        <h2>🎵 Our Special Video</h2>

        <a
            class="youtube-card"
            href="intent://youtube.com/shorts/duEuPlVba1s#Intent;scheme=https;package=com.google.android.youtube;end"
        >

            <img
                src="https://i.ytimg.com/vi/duEuPlVba1s/hqdefault.jpg"
                alt="Our Special Video"
            >

            <div class="play-button">
                ▶
            </div>

        </a>

        <div class="watch-text">
            Tap the video to open it in YouTube ❤️
        </div>

    </div>

    <div class="footer">
        Made with ❤️ just for you
    </div>

</div>

</body>
</html>
