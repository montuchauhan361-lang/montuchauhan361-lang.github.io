<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just For Us ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #250014, #4b0028, #18000e);
    color: white;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #ffb6d9;
    font-size: 20px;
    margin-bottom: 35px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    padding: 20px;
    margin-bottom: 25px;
}

.card h2 {
    color: #ff9dcc;
    font-size: 25px;
    margin-top: 0;
}

.video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
}

.video iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.footer {
    text-align: center;
    color: #ffb6d9;
    margin-top: 40px;
}
</style>
</head>

<body>

<div class="container">

    <h1>❤️ Just For Us ❤️</h1>

    <div class="subtitle">
        A little place made just for you.
    </div>

    <div class="card">

        <h2>🎵 Our Special Video</h2>

        <div class="video">

            <iframe
                src="https://www.youtube.com/embed/duEuPlVba1s"
                title="Our Special Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>

        </div>

    </div>

    <div class="footer">
        Made with ❤️ just for you
    </div>

</div>

</body>
</html>
