<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For Us ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #18000d, #4b0028, #16000c);
    padding: 30px 15px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 40px;
    margin: 20px 0 8px;
}

.subtitle {
    text-align: center;
    color: #ffb8d8;
    font-size: 18px;
    margin-bottom: 35px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 18px;
}

.card h2 {
    color: #ffafd2;
    margin: 5px 0 18px;
}

.youtube-card {
    display: block;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    text-decoration: none;
    background: #111;
}

.youtube-card img {
    display: block;
    width: 100%;
}

.play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 50px;
    border-radius: 14px;
    background: #ff0033;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
}

.watch {
    text-align: center;
    color: #ffb8d8;
    margin-top: 16px;
}

.footer {
    text-align: center;
    color: #ffb8d8;
    margin-top: 40px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <h1>❤️ Just For Us ❤️</h1>

    <div class="subtitle">
        A little place made just for you.
    </div>

    <div class="card">

        <h2>🎵 Our Special Video</h2>

        <a
            class="youtube-card"
            href="https://www.youtube.com/watch?v=duEuPlVba1s"
            target="_blank"
            rel="noopener noreferrer"
        >

            <img
                src="https://i.ytimg.com/vi/duEuPlVba1s/hqdefault.jpg"
                alt="Our Special Video"
            >

            <div class="play">▶</div>

        </a>

        <div class="watch">
            Tap the video to watch on YouTube ❤️
        </div>

    </div>

    <div class="footer">
        Made with ❤️ just for you
    </div>

</div>

</body>
</html>
